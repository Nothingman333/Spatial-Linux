<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#2d2056"/>
      <stop offset="0.55" stop-color="#140e29"/>
      <stop offset="1" stop-color="#07060e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="36%" r="64%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ead8ff"/>
      <stop offset="0.65" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f5d0fe"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none"
        stroke="#c084fc" stroke-opacity="0.22" stroke-width="3"/>

  <!-- glow -->
  <circle cx="256" cy="286" r="190" fill="url(#halo)"/>

  <!-- headband, glow then line -->
  <path d="M 132 292 C 132 150 380 150 380 292" fill="none"
        stroke="#c084fc" stroke-opacity="0.22" stroke-width="50" stroke-linecap="round"/>
  <path d="M 132 292 C 132 150 380 150 380 292" fill="none"
        stroke="url(#band)" stroke-width="27" stroke-linecap="round"/>

  <!-- back half of the orbit -->
  <g transform="rotate(-12 256 300)" fill="none" stroke-linecap="round">
    <path d="M 118 300 A 138 36 0 0 1 394 300" stroke="#c084fc" stroke-opacity="0.2" stroke-width="22"/>
    <path d="M 118 300 A 138 36 0 0 1 394 300" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="8"/>
  </g>

  <!-- the orb: the sound, between the ears -->
  <circle cx="256" cy="300" r="78" fill="#8b5cf6" fill-opacity="0.28"/>
  <circle cx="256" cy="300" r="60" fill="url(#orb)"/>
  <ellipse cx="237" cy="278" rx="20" ry="13" fill="#ffffff" fill-opacity="0.6"
           transform="rotate(-30 237 278)"/>

  <!-- ear cups -->
  <rect x="96" y="250" width="62" height="112" rx="31" fill="#8b5cf6" fill-opacity="0.25"/>
  <rect x="104" y="258" width="46" height="96" rx="23" fill="url(#cup)"/>
  <rect x="354" y="250" width="62" height="112" rx="31" fill="#8b5cf6" fill-opacity="0.25"/>
  <rect x="362" y="258" width="46" height="96" rx="23" fill="url(#cup)"/>
  <rect x="112" y="268" width="10" height="60" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="370" y="268" width="10" height="60" rx="5" fill="#ffffff" fill-opacity="0.35"/>

  <!-- front half of the orbit, over the orb -->
  <g transform="rotate(-12 256 300)" fill="none" stroke-linecap="round">
    <path d="M 394 300 A 138 36 0 0 1 118 300" stroke="#f5d0fe" stroke-opacity="0.22" stroke-width="22"/>
    <path d="M 394 300 A 138 36 0 0 1 118 300" stroke="url(#ring)" stroke-width="9"/>
    <circle cx="200" cy="333" r="18" fill="#f5d0fe" fill-opacity="0.35"/>
    <circle cx="200" cy="333" r="9" fill="#ffffff"/>
  </g>
</svg>
